[package]
name = "klock"
version = "0.1.0"
edition = "2021"
description = "OS track: the kernel spinlock type and the lock-order checker (SCHED-SMP-SPEC 3.4). The one pure-side crate allowed `unsafe`."

[dependencies]
kcore = { path = "../kcore" }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[target.'cfg(shuttle)'.dev-dependencies]
shuttle = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(shuttle)", "cfg(kani)"] }
