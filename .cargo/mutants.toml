# cargo-mutants (KT10): mutation testing of the pure kernel crates, with their host tests as the oracle. Run by `make os-mutants` and the
# overnight workflow only (hours); never by the gate.
exclude_globs = [
    "**/tests/**",
    # the frozen reference copy of the scheduler (L11b): tests compare against it, nothing depends on it
    "kcore/src/sched_smp_v0.rs",
]
# the host test suite of the mutated crate is the oracle; the loom and shuttle models need their own cfg and are not part of it
additional_cargo_test_args = ["--lib", "--tests"]
