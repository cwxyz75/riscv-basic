[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "OS track: the bare-metal kernel binary (S0: a stub that boots, runs self-tests and reports through the serial port and QEMU's test finisher)"

[dependencies]
abi = { path = "../abi" }
kcore = { path = "../kcore" }
# Free-list heap for the kernel (OD29). Small utility crate, as the home computer's
# kernel uses (decision D10 there).
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[features]
# Make one self-test fail on purpose, so the boot test can prove it sees failures.
fail-demo = []
# Boot with the plain round-robin scheduling class instead of fixed-priority (OD32).
# The priority-specific self-tests are skipped; the generic ones must still pass.
sched-round-robin = []
