[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "OS track: the bare-metal kernel binary (S0: a stub that boots, runs self-tests and reports through the serial port and QEMU's test finisher)"

[dependencies]
libsys = { path = "../libsys", default-features = false }
abi = { path = "../abi" }
proto = { path = "../proto" }
kcore = { path = "../kcore" }
rngcore = { path = "../rngcore" }
ksys = { path = "../ksys" }
klock = { path = "../klock" }
# Free-list heap for the kernel (OD29). Small utility crate, as the home computer's
# kernel uses (decision D10 there).
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[build-dependencies]
proto = { path = "../proto" }
libsys = { path = "../libsys" }

[features]
# Boot into the interactive system (S4): the supervisor `init`, the serial console bridge and
# the boot image instead of the user test suite.
interactive = []
# The system as it is meant to be used (T48): the interactive boot without the boot self-tests,
# the banners or the `##` lines for passing checks. Build it optimised (`make os-release`).
release = ["interactive"]
# HD4 part 3: the release content (no boot self-tests, no sched/smp tests) that still runs the embedded user suite and the kernel-side leak checks, so the
# Kernel tests (shard `k`) run on the optimised kernel that has no test code of its own. Not a shipped build: it holds the suite and its helper thread.
release-suite = ["release"]
# The interactive boot with `init` in its test-command mode (the scripted S4a-S4d checks drive its
# `run`, `ls`, `console` ... commands) instead of the supervisor that starts the shell.
repl = ["interactive"]
# Print the pc, address and return address of every fatal user fault on the console (headless debugging).
fault-log = []
# Make one self-test fail on purpose, so the boot test can prove it sees failures.
fail-demo = []
# A kernel thread that overflows its stack on purpose: the guard page and the emergency stack must turn it
# into a `##PANIC kernel stack overflow` report (`make os-boot-test-overflow`).
stack-overflow-demo = []
# The latency trace (slice B, SCHED-SMP-SPEC 3.12): per hart the longest interrupts-off span and its site, and per syscall
# the big-lock hold and wait times; printed at the end of the run (`make os-latency`). Off: no code at all.
latency-trace = []
# Boot with the plain round-robin scheduling class instead of fixed-priority (OD32).
# The priority-specific self-tests are skipped; the generic ones must still pass.
sched-round-robin = []
# (KT7) schedule perturbation: seeded random delays at lock, IPI, switch and user-return points (boot argument `chaos=<seed>`); no code without it.
chaos = []
# Negative controls for the SMP tests (S5d): each disables one safety mechanism, and the test
# that guards it must then fail (the harness runs these builds and requires that).
fault-skip-shootdown = []
# MM8: a SNAPSHOT leaves the source's writable translations as they were; a write through them then reaches the child's pages
fault-skip-cow-protect = []
# MM6/MM7: a decommit, or a protect that takes a permission away, leaves the other harts' translations alone; the sibling-thread tests must then fail
fault-decommit-no-shootdown = []
fault-protect-no-shootdown = []
fault-skip-kernel-satp = []
# L18 negative control: a hart installs a newer generation's address space without the flush it owes, and the ASID field counts as one bit
# (one ASID per generation: every new process turns the generation). The harm is a stale translation under a reused ASID; QEMU drops its
# translations when `satp` changes, so no boot shows it (T205): the host model in `kcore/tests/asid_model.rs` is the oracle.
fault-asid-reuse-no-flush = []
fault-skip-kill-ipi = []
# (slice A) forget to save dirty FP registers at a trap: the FP isolation test must fail.
fault-skip-fp-save = []
# (slice W) a handle removed by `replace` or sent away is not told to the wait table: a thread waiting on
# it must then stay asleep, and the test that guards the forced wake must fail.
fault-skip-forced-touch = []
# (L11d) the scheduler's negative controls: pokes are dropped (and an idle hart takes no tick, as in tickless idle, so the poke is its only
# wake), a hart never pulls, an exiting detached thread's stack is freed before its switch completes.
fault-skip-poke = []
fault-skip-entry-check = []
# T188 item 5: `senvcfg.CBZE` is not set, so a user `cbo.zero` traps (`vector_state_is_private_to_each_thread_and_process` must fail)
fault-skip-cbze = []
fault-skip-pull = ["kcore/fault-skip-pull"]
fault-early-reap = []
# KT9 (guest half): the kernel heap fails the Nth allocation made by an armed thread (`debug_stat` 200 to 202); only for `make os-allocfail`
fault-alloc = []
# Negative control for the AIA: an acknowledged source is never unmasked again (needs the AIA machine).
fault-aia-no-unmask = []
# Negative control for the AIA: an acknowledged source whose line is still high is not re-pended.
fault-aia-no-repend = []
