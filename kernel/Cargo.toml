[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "Bare-metal RISC-V (S-mode) host for the BASIC interpreter on QEMU virt"

[dependencies]
basic = { path = "../basic" }
console = { path = "../console" }
turtle = { path = "../turtle" }
logo = { path = "../logo" }
rv64 = { path = "../rv64" }
# Free-list heap for the interpreter's strings, variables and program store
# (decision D10).
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
