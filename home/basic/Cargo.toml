[package]
name = "basic"
version = "0.1.0"
edition = "2021"
description = "BASIC interpreter core: no_std, hardware-free, testable on the host"

# `libm` provides pow/trunc without std (decision D4).
[dependencies]
libm = "0.2"
# Pure ANSI escape helpers (no hardware): CLS, COLOR and LOCATE are built on them.
console = { path = "../console" }
# The disk interface (pure): SAVE, LOAD, DIR and SCRATCH talk to `cartfs::Files`.
cartfs = { path = "../cartfs" }

[dev-dependencies]
basic-script = { path = "../basic-script" }
