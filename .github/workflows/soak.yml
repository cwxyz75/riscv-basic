name: soak

# Tier 2 of TESTING.md / OD83, as changed by OD142: the full matrix, every negative control, the serial sessions,
# Miri. It runs ONLY when the owner starts it by hand (Actions > soak > Run workflow, or `gh workflow run soak.yml`).
# There is no schedule and no pull-request trigger, and nobody else starts it. Never required to merge.
on:
  workflow_dispatch:

jobs:
  # CI's QEMU (TEST-TOOLS.md, "CI's QEMU"): look the cache entry up, and build it if this branch's cache has none; the jobs that boot
  # restore it.
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Look up CI's QEMU, and build it into the cache if it is missing
        uses: ./.github/actions/install-qemu
        with:
          mode: fill
          packages: ''

  kernel:
    needs: qemu
    name: soak (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      # the baseline is from a laptop; hosted runners are several times slower (SCHED-SMP-SPEC T75)
      BENCH_RATIO: "30"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal and fail-demo
            targets: os-boot-test-main
          - name: round-robin
            targets: os-boot-test-rr
          - name: release build
            targets: os-boot-test-release
          - name: smp
            targets: os-boot-test-smp os-boot-test-overflow os-bench os-latency
          - name: negative controls and serial at four harts
            targets: os-boot-test-smp-neg os-boot-test-sched-neg
          - name: lossy relay
            targets: os-boot-test-lossy
          - name: AIA, RVA23, no disk, serial
            targets: os-boot-test-aia os-boot-test-nodisk os-boot-test-cpu-neg os-boot-test-iommu-neg os-boot-test-iommu-bare os-boot-test-iommu-inval os-boot-test-iommu-msi os-boot-test-loadaddr os-boot-test-sbi-console os-boot-test-entropy os-serial-test os-release-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: soak-${{ matrix.name }}
      - name: Install QEMU
        uses: ./.github/actions/install-qemu
        with:
          packages: clang llvm device-tree-compiler
      - uses: actions/cache@v4
        with:
          path: third_party/fetched
          key: fetched-busybox-${{ hashFiles('third_party/fetch-manifest.txt') }}
      - name: Fetch BusyBox (pinned by sha256; the serial tests run its applets)
        run: FETCH_ONLY="busybox kilo sqlite gzip" make fetch-third-party
      - name: The QEMU on the PATH is CI's pinned build (fails otherwise), and the clang version
        run: |
          .github/actions/install-qemu/check-qemu.sh
          clang --version | head -1
      - run: make ${{ matrix.targets }}
      # the serial log of every failing boot (scripts/os_boot_test.py writes it to target/fail-logs/) and of a failing repeat run
      - name: Keep the logs of failing boots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-logs-${{ strategy.job-index }}
          path: |
            target/fail-logs/
            target/repeat/
          if-no-files-found: ignore

  miri:
    name: soak (miri)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - run: make os-miri
