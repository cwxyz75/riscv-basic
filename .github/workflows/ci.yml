name: ci

# The merge gate (tiers 0 and 1 of TESTING.md / OD83): host tests and lint, one boot of the suite at four
# harts, the release smoke, the home computer's boot. Every job's timeout is its budget; a job that
# outgrows it fails loudly and the budget is raised (or the work cut) on purpose, in TESTING.md. The
# full matrix (tier 2) is `soak.yml`: nightly, on the `soak` label and on demand, never required.
# Pull requests run the suite once; pushes only matter on main (a branch push with an open PR would
# run exactly the same jobs a second time).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # What did this change touch? Documentation-only changes skip the boot matrix; changes under
  # home/ only skip the OS-track boot jobs and the other way round (shared files run everything).
  # A skipped job counts as passed for branch protection.
  changes:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.scan.outputs.os }}
      home: ${{ steps.scan.outputs.home }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scan
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "os=true" >> "$GITHUB_OUTPUT"; echo "home=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          # anything that is not documentation, not under home/, and not a home-only script
          os=false; home=false
          while IFS= read -r f; do
            case "$f" in
              *.md) ;;
              home/*) home=true ;;
              *) os=true; home=true ;;
            esac
          done <<< "$files"
          # the OS track also uses the shared pure crates under home/
          case "$files" in *home/basic/*|*home/console/*|*home/basic-script/*|*home/turtle/*|*home/logo/*|*home/rv64/*|*home/cartfs/*) os=true ;; esac
          echo "os=$os" >> "$GITHUB_OUTPUT"; echo "home=$home" >> "$GITHUB_OUTPUT"

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check_docs.py
      - run: cargo clippy -p abi -p cfmt -p clockmodel -p data -p ish -p kcore -p proto -p svc -p memfs -p mounts -p pathres -p profile -p fsfmt -p doofs -p doofs-tools -p basic -p basic-script -p cartfs -p console -p turtle -p logo -p rv64 --all-targets -- -D warnings
      - run: cargo test -p abi -p cfmt -p clockmodel -p data -p ish -p kcore -p klock -p netwire -p netcore -p netsim -p nettcp -p rngcore -p sockshim -p dns -p http1 -p supervise -p dhcp -p netring -p proto -p svc -p memfs -p mounts -p pathres -p profile -p fsfmt -p doofs -p doofs-tools -p basic -p basic-script -p cartfs -p console -p turtle -p logo -p rv64
      - name: OS crates under the loom and shuttle model checkers
        run: make os-test
      - name: Check the demo pictures against the independent renderer
        run: python3 home/scripts/verify_demo_images.py

  # Tier 1: the suite boots twice on the default (AIA) machine at four harts, as two parallel jobs (OD121: `core` is everything but
  # the network tests, `net` is the network tests; the harness checks each ran only its part), and the release smoke is a third.
  # Budget: 7 minutes each (the docs check enforces it). The one job that held all of it took 9.6 minutes of its 10 on 2026-11-18;
  # a shard that nears the budget is split again by the same mechanism (TESTING.md "When the smoke boot outgrows its budget").
  # (The fail-demo check, when the harness changed, is the separate job `harness (fail-demo)`.)
  kernel:
    name: kernel (smoke core)
    needs: changes
    if: ${{ needs.changes.outputs.os == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke
      - name: Install QEMU and OpenSBI
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y qemu-system-riscv opensbi clang llvm
      - name: QEMU and OpenSBI versions, and whether this QEMU has AIA
        run: |
          qemu-system-riscv64 --version | head -1
          qemu-system-riscv64 -machine virt,help | grep -i "aia" || echo "NO AIA OPTION"
          dpkg -l opensbi | tail -1
      - run: make os-boot-test-smoke-core

  kernel-net:
    name: kernel (smoke net)
    needs: changes
    if: ${{ needs.changes.outputs.os == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke
      - name: Install QEMU and OpenSBI
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y qemu-system-riscv opensbi clang llvm
      - name: QEMU and OpenSBI versions, and whether this QEMU has AIA
        run: |
          qemu-system-riscv64 --version | head -1
          qemu-system-riscv64 -machine virt,help | grep -i "aia" || echo "NO AIA OPTION"
          dpkg -l opensbi | tail -1
      - run: make os-boot-test-smoke-net

  # The release smoke: the release image boots to the shell and reports no test banners (its own job, in parallel with the boots).
  release-smoke:
    name: kernel (release smoke)
    needs: changes
    if: ${{ needs.changes.outputs.os == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-smoke
      - name: Install QEMU and OpenSBI
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y qemu-system-riscv opensbi clang llvm
      - run: make os-release-smoke

  # The shell test (BusyBox applets, programs that start programs, signals) needs the BusyBox sources, which are fetched (and cached:
  # the archive is pinned by its sha256 in third_party/fetch-manifest.txt), not committed. Without them `busybox` is a stub.
  shell-test:
    name: kernel (shell test)
    needs: changes
    if: ${{ needs.changes.outputs.os == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: shell-test
      - name: Install QEMU and OpenSBI
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y qemu-system-riscv opensbi clang llvm
      - uses: actions/cache@v4
        with:
          path: third_party/fetched
          key: fetched-busybox-${{ hashFiles('third_party/fetch-manifest.txt') }}
      - name: Fetch BusyBox (pinned by sha256)
        run: FETCH_ONLY="busybox kilo sqlite gzip" make fetch-third-party
      - name: Build the interactive image and run the shell test
        run: |
          make os-interactive
          python3 scripts/s4e_shell_test.py target/os-interactive/riscv64gc-unknown-none-elf/debug/kernel

  # If the harness itself changed (scripts/os_boot_test.py or the Makefile), prove it still sees a failure: a kernel built with a
  # deliberate fault must fail the boot test. Its own job, so its minutes do not come out of the smoke job's budget.
  harness-fail-demo:
    name: harness (fail-demo)
    needs: changes
    if: ${{ needs.changes.outputs.os == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the harness change?
        id: h
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(scripts/os_boot_test.py|Makefile)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain from rust-toolchain.toml
        if: steps.h.outputs.changed == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.h.outputs.changed == 'true'
        with:
          key: smoke
      - name: Install QEMU and OpenSBI
        if: steps.h.outputs.changed == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y qemu-system-riscv opensbi clang llvm
      - name: fail-demo
        if: steps.h.outputs.changed == 'true'
        run: |
          make os-boot-test-fail-demo

  # The home computer is its own job: it only needs to run when home/ or something shared changed.
  home-kernel:
    name: kernel (home computer)
    needs: changes
    if: ${{ needs.changes.outputs.home == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: home
      - name: Install QEMU and OpenSBI
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y qemu-system-riscv opensbi
      - run: make home-boot-test
