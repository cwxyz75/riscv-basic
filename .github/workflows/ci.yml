name: ci

# Pull requests run the suite once; pushes only matter on main (a branch push with an open PR would
# run exactly the same jobs a second time).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p abi -p kcore -p proto -p memfs -p basic -p cartfs -p console -p turtle -p logo -p rv64 --all-targets -- -D warnings
      - run: cargo test -p abi -p kcore -p proto -p memfs -p basic -p cartfs -p console -p turtle -p logo -p rv64
      - name: OS crates under the loom and shuttle model checkers
        run: make os-test
      - name: Check the demo pictures against the independent renderer
        run: python3 home/scripts/verify_demo_images.py

  # The boot tests, as parallel jobs: a slow or flaky one (they follow the host clock and CI runners
  # are several times slower than a laptop: TIDY-UP T21) no longer hides the others.
  kernel:
    name: kernel (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home computer
            targets: home-boot-test
          - name: normal and fail-demo
            targets: os-boot-test-main
          - name: round-robin
            targets: os-boot-test-rr
          - name: AIA, RVA23, serial
            targets: os-boot-test-aia os-boot-test-rva23 os-serial-test
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install QEMU and OpenSBI
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y qemu-system-riscv opensbi
      - name: QEMU and OpenSBI versions, and whether this QEMU has AIA
        run: |
          qemu-system-riscv64 --version | head -1
          qemu-system-riscv64 -machine virt,help | grep -i "aia" || echo "NO AIA OPTION"
          qemu-system-riscv64 -cpu help | grep -i rva23 || echo "NO RVA23 CPU"
          dpkg -l opensbi | tail -1
      - run: make ${{ matrix.targets }}

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - run: make os-miri
