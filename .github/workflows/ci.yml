name: ci

on: [push, pull_request]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p abi -p kcore -p basic -p cartfs -p console -p turtle -p logo -p rv64 --all-targets -- -D warnings
      - run: cargo test -p abi -p kcore -p basic -p cartfs -p console -p turtle -p logo -p rv64
      - name: OS crates under the loom and shuttle model checkers
        run: make os-test
      - name: Check the demo pictures against the independent renderer
        run: python3 scripts/verify_demo_images.py

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install QEMU and OpenSBI
        run: sudo apt-get update && sudo apt-get install -y qemu-system-riscv opensbi
      - run: make boot-test os-boot-test

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - run: make os-miri
