name: overnight

# Tier 3 of TESTING.md (KT6, OD142): the long runs, hours each. It runs ONLY when the owner starts it by hand
# (Actions > overnight > Run workflow, or `gh workflow run overnight.yml`). There is no schedule and no pull-request trigger, and
# nobody else starts it. Never required to merge. A red run is a work item the same day (OD140), not noise.
on:
  workflow_dispatch:

jobs:
  # CI's QEMU (TEST-TOOLS.md, "CI's QEMU"): look the cache entry up, and build it if this branch's cache has none; the jobs that boot
  # restore it.
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Look up CI's QEMU, and build it into the cache if it is missing
        uses: ./.github/actions/install-qemu
        with:
          mode: fill
          packages: ''

  repeat-smp:
    name: overnight (repeat smp)
    needs: qemu
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BENCH_RATIO: "10"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: overnight-repeat-smp
      - name: Install QEMU
        uses: ./.github/actions/install-qemu
      - uses: actions/cache@v4
        with:
          path: third_party/fetched
          key: fetched-busybox-${{ hashFiles('third_party/fetch-manifest.txt') }}
      - name: Fetch BusyBox (pinned by sha256)
        run: FETCH_ONLY="busybox kilo sqlite gzip" make fetch-third-party
      - run: make overnight-repeat-smp
      - name: Summary
        if: always()
        run: |
          echo "## overnight (repeat smp): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs of failing boots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-logs-repeat-smp
          path: |
            target/fail-logs/
            target/repeat/
          if-no-files-found: ignore

  checked:
    name: overnight (checked release)
    needs: qemu
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BENCH_RATIO: "10"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: overnight-checked
      - name: Install QEMU
        uses: ./.github/actions/install-qemu
      - uses: actions/cache@v4
        with:
          path: third_party/fetched
          key: fetched-busybox-${{ hashFiles('third_party/fetch-manifest.txt') }}
      - name: Fetch BusyBox (pinned by sha256)
        run: FETCH_ONLY="busybox kilo sqlite gzip" make fetch-third-party
      - run: make os-boot-test-checked
      - name: Summary
        if: always()
        run: |
          echo "## overnight (checked release): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs of failing boots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-logs-checked
          path: target/fail-logs/
          if-no-files-found: ignore

  chaos:
    name: overnight (schedule perturbation)
    needs: qemu
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BENCH_RATIO: "10"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: overnight-chaos
      - name: Install QEMU
        uses: ./.github/actions/install-qemu
      - run: make os-chaos
      - name: Summary
        if: always()
        run: |
          echo "## overnight (schedule perturbation): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          ls target/chaos 2>/dev/null | sed 's/^/- failing: /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the logs of failing seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-logs-chaos
          path: target/chaos/
          if-no-files-found: ignore

  mutants:
    name: overnight (mutants ${{ matrix.pkg }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: klock, shard: "0/1"}
          - {pkg: iommucore, shard: "0/1"}
          - {pkg: pcicore, shard: "0/1"}
          - {pkg: virtio, shard: "0/1"}
          - {pkg: kcore, shard: "0/8"}
          - {pkg: kcore, shard: "1/8"}
          - {pkg: kcore, shard: "2/8"}
          - {pkg: kcore, shard: "3/8"}
          - {pkg: kcore, shard: "4/8"}
          - {pkg: kcore, shard: "5/8"}
          - {pkg: kcore, shard: "6/8"}
          - {pkg: kcore, shard: "7/8"}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: overnight-mutants-${{ matrix.pkg }}
      - name: Install cargo-mutants (a tool, not a dependency of any crate; pinned)
        run: cargo install cargo-mutants --locked --version 25.3.1
      - run: make os-mutants PKG=${{ matrix.pkg }} SHARD=${{ matrix.shard }}
      - name: Keep the mutant lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.pkg }}-${{ strategy.job-index }}
          path: |
            target/mutants-*/mutants.out/missed.txt
            target/mutants-*/mutants.out/timeout.txt
            target/mutants-*/mutants.out/caught.txt
          if-no-files-found: ignore

  coverage:
    name: overnight (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: overnight-coverage
      - name: Install llvm-tools and cargo-llvm-cov (tools, not dependencies of any crate; pinned)
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version 0.9.2
      - run: make os-coverage
      - name: Summary
        if: always()
        run: |
          echo "## overnight (coverage)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only 2>/dev/null | cut -c1-120 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/cov/html
          if-no-files-found: ignore

  fuzz-host:
    name: overnight (host fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: overnight-fuzz-host
      - run: make os-fuzz-host
      - name: Summary
        if: always()
        run: |
          echo "## overnight (host fuzz): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  allocfail:
    name: overnight (allocation failure)
    needs: qemu
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: overnight-allocfail
      # (the guest half of the sweep boots a kernel: CI's QEMU, and clang for the boot image's C programs)
      - name: Install QEMU
        uses: ./.github/actions/install-qemu
      - run: make os-allocfail
      - name: Summary
        if: always()
        run: |
          echo "## overnight (allocation failure): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
