[package]
name = "init"
version = "0.1.0"
edition = "2021"
description = "OS track: the first user program (the boot-time user test suite) and the `crash` program that misbehaves on purpose (S3b)"

[dependencies]
proto = { path = "../proto" }
svc = { path = "../svc" }
kcore = { path = "../kcore" }
oslibc = { path = "../libc" }
basic = { path = "../home/basic" }
basic-script = { path = "../home/basic-script" }
memfs = { path = "../memfs" }
doofs = { path = "../doofs" }
fsfmt = { path = "../fsfmt" }
clockmodel = { path = "../clockmodel" }
mounts = { path = "../mounts" }
pathres = { path = "../pathres" }
rt = { path = "../rt", features = ["heap"] }
libsys = { path = "../libsys", default-features = false }
abi = { path = "../abi" }
kfuzz-gen = { path = "../kfuzz-gen" }
shell-core = { path = "../shell-core" }
ish = { path = "../ish" }
profile = { path = "../profile" }
auth = { path = "../auth" }
netring = { path = "../netring" }
netwire = { path = "../netwire" }
netcore = { path = "../netcore" }
dhcp = { path = "../dhcp" }
supervise = { path = "../supervise" }
rngcore = { path = "../rngcore" }
http1 = { path = "../http1" }
