# Applies when cargo is run from inside init/ (the Makefile does this): user programs
# are built for the hardware floating-point RISC-V target (rv64gc, lp64d; OD76, which superseded the
# soft-float user target of OD40), as static executables.
[build]
target = "riscv64gc-unknown-none-elf"
# The programs go into the boot image, which every service holds copies of: no symbol tables in them (they were 2x larger on CI's
# machine and the hog test had 26 MiB of heap left instead of 120; a panic names its message and place, not the symbol).
rustflags = ["-C", "strip=symbols"]
