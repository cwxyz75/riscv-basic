[workspace]
resolver = "2"
members = ["basic", "console", "kernel", "logo", "rv64", "turtle"]
# Plain `cargo test` / `cargo build` at the root only touches the host-testable
# interpreter crate. The kernel targets bare-metal RISC-V and is built from
# inside kernel/ (see Makefile), which picks up kernel/.cargo/config.toml.
default-members = ["basic", "console", "logo", "rv64", "turtle"]
